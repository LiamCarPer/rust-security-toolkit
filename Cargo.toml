[package]
name = "rust-security-toolkit"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
bincode = "1"
borsh = { version = "1", features = ["derive"] }
bs58 = "0.5"
clap = { version = "4.4", features = ["derive", "env"] }
colored = "2"
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-client = "=4.1.2"
solana-sdk = "=4.0.1"

# Exact-version pins for the agave 4.1.2 release train (May 2026).
# Upstream modular crates migrated to wincode 0.6 in July 2026 while
# solana-transaction-status(-client-types) 4.1.2 still requires wincode 0.5,
# so a plain "latest of everything" resolution does not compile. These pins
# keep the graph on the mutually compatible pre-migration release set shipped
# together in the agave v4.1.2 workspace (see anza-xyz/agave workspace
# Cargo.toml).
solana-account = "=4.3.0"
solana-account-info = "=3.1.1"
solana-address = "=2.6.0"
solana-address-lookup-table-interface = "=3.1.0"
solana-client-traits = "=4.0.0"
solana-hash = "=4.3.0"
solana-instruction = "=3.4.0"
solana-keypair = "=3.1.2"
solana-message = "=4.1.1"
solana-program = "=4.0.0"
solana-pubkey = "=4.2.0"
solana-rent = "=4.2.0"
solana-reward-info = "=6.2.0"
solana-short-vec = "=3.2.1"
solana-signature = "=3.4.0"
solana-system-interface = "=3.2.0"
solana-sysvar = "=4.0.0"
solana-transaction = "=4.1.1"
solana-transaction-error = "=3.2.0"
solana-vote-interface = "=6.0.0"
solana-zk-sdk = "=5.0.1"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "rts"
path = "src/main.rs"

[dev-dependencies]
httpmock = "0.7"
proptest = "1"
solana-transaction-status = "4"
solana-transaction-status-client-types = "4"
tokio-test = "0.4.5"
