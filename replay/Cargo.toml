[package]
name = "rts-replay"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
bincode = "1"
hex = "0.4"
litesvm = "0.16"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account = "~4.3.0"
solana-address = "~2.6.1"
solana-transaction = { version = "~4.1.5", features = ["serde"] }

[dev-dependencies]
solana-hash = "~4.5.0"
solana-keypair = "~3.1.2"
solana-message = "~4.2.4"
solana-signature = "~3.4.1"
solana-signer = "~3.0.1"
solana-system-interface = "~3.2.0"
